[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "populi-api-python"
version = "0.1.0"
description = "Python client for Populi API"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
  "beautifulsoup4==4.9.1",
  "bs4==0.0.2",
  "nose==1.3.7",
  "pycodestyle==2.6.0",
  "pycurl==7.45.0",
  "soupsieve==2.0.1",
  "toml==0.10.1",
]
